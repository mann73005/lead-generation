# Render alternative to Railway. Render still has a genuinely free web service
# tier; Railway's is now a trial credit. The service is identical either way —
# only this descriptor differs, because the app is containerised.
#
# Free instances sleep after ~15 minutes idle and take roughly 50 seconds to
# wake. That matters here: the open-tracking pixel is fetched by the
# recipient's mail client, and a cold start can delay or drop that request. For
# a live demo, hit /health first to warm the instance.

services:
  - type: web
    name: stylesense-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_OVERRIDE_TO
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: BOOTSTRAP_USER_EMAIL
        sync: false
      - key: BOOTSTRAP_USER_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
